name: Researcher Inventory Contract Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'researcher_inventory/**'
      - '.github/workflows/researcher-inventory-contract-test.yml'

permissions:
  contents: read

concurrency:
  group: researcher-inventory-contract-test
  cancel-in-progress: false

jobs:
  repeatability-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.CASES_INVENTORY_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      CONTRACT_VERSION: RI-CONTRACT-V2
      TEST_REPETITIONS: '3'
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify route-specific secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'CASES_INVENTORY_KEY is not available to this workflow.' >&2
            exit 1
          fi

      - name: Bootstrap calibration agent
        shell: bash
        run: python researcher_inventory/session_bootstrap.py

      - name: Run three-pass approved-archetype calibration
        id: calibration
        shell: bash
        continue-on-error: true
        run: python researcher_inventory/test_runner.py

      - name: Run sealed Case 5 holdout only after calibration passes
        id: holdout
        if: steps.calibration.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: python researcher_inventory/holdout_runner.py

      - name: Bootstrap brand-new clean-room agent after holdout passes
        id: fresh_bootstrap
        if: steps.holdout.outcome == 'success'
        shell: bash
        run: python researcher_inventory/session_bootstrap.py

      - name: Verify finalized instructions on known archetypes with fresh agent
        id: clean_archetypes
        if: steps.fresh_bootstrap.outcome == 'success'
        shell: bash
        continue-on-error: true
        env:
          TEST_REPETITIONS: '1'
        run: python researcher_inventory/test_runner.py

      - name: Re-run Case 5 from fresh agent with no prior session history
        id: clean_holdout
        if: steps.clean_archetypes.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: python researcher_inventory/holdout_runner.py

      - name: Preserve bounded calibration packet in workflow log
        if: always()
        shell: bash
        run: |
          echo '=== APA RESEARCHER INVENTORY CALIBRATION PACKET BEGIN ==='
          if [ -f researcher_inventory/runtime/test_results.json ]; then cat researcher_inventory/runtime/test_results.json; else echo '{"calibration_packet_missing":true}'; fi
          echo '=== APA RESEARCHER INVENTORY CALIBRATION PACKET END ==='

      - name: Preserve bounded holdout packet in workflow log
        if: always()
        shell: bash
        run: |
          echo '=== APA RESEARCHER INVENTORY HOLDOUT PACKET BEGIN ==='
          if [ -f researcher_inventory/runtime/holdout_result.json ]; then cat researcher_inventory/runtime/holdout_result.json; else echo '{"holdout_not_released":true}'; fi
          echo '=== APA RESEARCHER INVENTORY HOLDOUT PACKET END ==='

      - name: Fail if archetype calibration is not ready
        if: steps.calibration.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Fail if sealed holdout was released but failed
        if: steps.calibration.outcome == 'success' && steps.holdout.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Fail if clean-room archetype verification failed
        if: steps.holdout.outcome == 'success' && steps.clean_archetypes.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Fail if clean-room Case 5 verification failed
        if: steps.clean_archetypes.outcome == 'success' && steps.clean_holdout.outcome == 'failure'
        shell: bash
        run: exit 1
