name: Researcher Inventory Contract Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'researcher_inventory/**'
      - '.github/workflows/researcher-inventory-contract-test.yml'

permissions:
  contents: read

concurrency:
  group: researcher-inventory-contract-test
  cancel-in-progress: false

jobs:
  repeatability-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.CASES_INVENTORY_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      CONTRACT_VERSION: RI-CONTRACT-V2
      TEST_REPETITIONS: '2'
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Verify route-specific secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'CASES_INVENTORY_KEY is not available to this workflow.' >&2
            exit 1
          fi

      - name: Bootstrap dedicated calibration agent
        shell: bash
        run: python researcher_inventory/session_bootstrap.py

      - name: Run approved-archetype calibration fixtures
        id: tests
        shell: bash
        continue-on-error: true
        run: python researcher_inventory/test_runner.py

      - name: Preserve all training attempts in workflow log
        if: always()
        shell: bash
        run: |
          echo '=== APA RESEARCHER INVENTORY TRAINING PACKET BEGIN ==='
          if [ -f researcher_inventory/runtime/test_results.json ]; then
            cat researcher_inventory/runtime/test_results.json
          else
            echo '{"training_packet_missing":true}'
          fi
          echo '=== APA RESEARCHER INVENTORY TRAINING PACKET END ==='

      - name: Fail workflow if archetype calibration failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: exit 1
