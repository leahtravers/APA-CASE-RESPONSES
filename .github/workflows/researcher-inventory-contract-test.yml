name: Researcher Inventory Continuous Training

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'researcher_inventory/AGENT_CONTRACT.md'
      - 'researcher_inventory/output_schema.json'
      - 'researcher_inventory/session_bootstrap.py'
      - 'researcher_inventory/test_runner.py'
      - 'researcher_inventory/contract_reviser.py'
      - 'researcher_inventory/holdout_runner.py'
      - 'researcher_inventory/tests/**'
      - '.github/workflows/researcher-inventory-contract-test.yml'

permissions:
  contents: write

concurrency:
  group: researcher-inventory-continuous-training
  cancel-in-progress: false

jobs:
  train-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENAI_API_KEY: ${{ secrets.CASES_INVENTORY_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      CONTRACT_VERSION: RI-CONTRACT-V2
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          git config user.name "APA Cases Training"
          git config user.email "apa-cases-training@users.noreply.github.com"

      - name: Verify route-specific secret exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'CASES_INVENTORY_KEY is not available to this workflow.' >&2
            exit 1
          fi

      - name: Stop immediately when clean-room certification already exists
        id: final_state
        shell: bash
        run: |
          if [ -f researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md ]; then
            echo "certified=true" >> "$GITHUB_OUTPUT"
            echo "Researcher Inventory training is already clean-room certified."
          else
            echo "certified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bounded autonomous archetype training loop
        id: calibration
        if: steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          set -u
          mkdir -p researcher_inventory/runtime researcher_inventory/status
          PASSED=0
          for ROUND in 1 2 3 4; do
            echo "=== CALIBRATION ROUND ${ROUND} ==="
            python researcher_inventory/session_bootstrap.py
            if TEST_REPETITIONS=2 python researcher_inventory/test_runner.py; then
              PASSED=1
              echo "approved archetype gate passed"
              break
            fi

            echo "archetype gate failed; revising behavioral contract from recorded findings"
            python researcher_inventory/contract_reviser.py
            git add researcher_inventory/AGENT_CONTRACT.md researcher_inventory/training_contracts || true
            if ! git diff --cached --quiet; then
              git commit -m "training: revise researcher inventory contract round ${ROUND} [skip ci]"
              git pull --rebase origin main
              git push origin main
            fi
          done
          if [ "$PASSED" -ne 1 ]; then
            echo "calibration did not reach gate within this bounded run; next scheduled GitHub run will continue"
            exit 2
          fi
          cat > researcher_inventory/status/ARCHETYPE_CALIBRATED.md <<'EOF'
          # Researcher Inventory Archetype Calibration

          The active Researcher Inventory contract passed two consecutive runs on each Leah-approved calibration archetype under the repository comparator. This status releases the sealed Case 5 holdout to the holdout runner only.
          EOF

      - name: Commit archetype calibration status
        if: steps.final_state.outputs.certified != 'true' && steps.calibration.outcome == 'success'
        shell: bash
        run: |
          git add researcher_inventory/status/ARCHETYPE_CALIBRATED.md
          if ! git diff --cached --quiet; then
            git commit -m "training: mark archetype calibration passed [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Run sealed Case 5 holdout only after archetype calibration passes
        id: holdout
        if: steps.final_state.outputs.certified != 'true' && steps.calibration.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          python researcher_inventory/holdout_runner.py

      - name: Bootstrap brand-new clean-room agent after first holdout passes
        id: fresh_bootstrap
        if: steps.holdout.outcome == 'success'
        shell: bash
        run: python researcher_inventory/session_bootstrap.py

      - name: Verify finalized instructions on approved archetypes with fresh agent
        id: clean_archetypes
        if: steps.fresh_bootstrap.outcome == 'success'
        shell: bash
        continue-on-error: true
        env:
          TEST_REPETITIONS: '1'
        run: python researcher_inventory/test_runner.py

      - name: Re-run Case 5 from fresh agent with no prior session history
        id: clean_holdout
        if: steps.clean_archetypes.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: python researcher_inventory/holdout_runner.py

      - name: Certify clean-room repeatability
        if: steps.clean_holdout.outcome == 'success'
        shell: bash
        run: |
          mkdir -p researcher_inventory/status
          cat > researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md <<'EOF'
          # Researcher Inventory Clean-Room Certification

          Certification conditions satisfied:

          1. Active instructions passed the Leah-approved Case 2 and Case 6 archetype gate.
          2. The sealed Case 5 holdout passed only after that gate released it.
          3. The calibration lineage was not reused for final proof.
          4. A newly bootstrapped agent received the finalized durable instructions.
          5. The fresh agent passed the approved archetypes and the Case 5 holdout again with no prior session history.

          Candidate/research status only. This certification does not promote any inventory to the Oval Office and does not mint APA IDs.
          EOF
          git add researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md
          git commit -m "training: clean-room certify researcher inventory agent [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Preserve bounded training packets in workflow log
        if: always() && steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          echo '=== APA RESEARCHER INVENTORY TRAINING PACKET BEGIN ==='
          if [ -f researcher_inventory/runtime/test_results.json ]; then cat researcher_inventory/runtime/test_results.json; else echo '{"calibration_packet_missing":true}'; fi
          echo '=== APA RESEARCHER INVENTORY TRAINING PACKET END ==='
          echo '=== APA RESEARCHER INVENTORY HOLDOUT PACKET BEGIN ==='
          if [ -f researcher_inventory/runtime/holdout_result.json ]; then cat researcher_inventory/runtime/holdout_result.json; else echo '{"holdout_not_released":true}'; fi
          echo '=== APA RESEARCHER INVENTORY HOLDOUT PACKET END ==='

      - name: Report bounded continuation state
        if: always() && steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          if [ -f researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md ]; then
            echo "CLEAN ROOM CERTIFIED"
            exit 0
          fi
          if [ -f researcher_inventory/status/ARCHETYPE_CALIBRATED.md ]; then
            echo "Archetype calibrated; holdout/clean-room verification remains in progress or failed. Next scheduled run will continue."
            exit 0
          fi
          echo "Archetype calibration remains in progress. Next scheduled GitHub run will continue."
          exit 0
