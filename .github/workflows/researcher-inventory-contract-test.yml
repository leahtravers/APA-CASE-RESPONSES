name: Researcher Inventory Apparatus Verification
# V118 prospectively supersedes V117 for new calibration. V117 and all earlier contracts/runs remain historical evidence.
# V118 uses a minimal sufficient binding basis at source-individuated grain.
# Immutable archetype verification, V66/V88A evaluator mechanics, durable attempt history, one-shot holdout isolation, and clean-room certification remain mandatory.
# V118 execution trigger: 2026-09-20; semantic contract, evaluator, harness, archetypes, and certification gates unchanged.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'researcher_inventory/**'
      - '.github/workflows/researcher-inventory-contract-test.yml'

permissions:
  contents: write

concurrency:
  group: researcher-inventory-apparatus-verification
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENAI_API_KEY: ${{ secrets.CASES_INVENTORY_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      CONTRACT_VERSION: RI-CONTRACT-V118
      RI_CONTRACT_FILE: researcher_inventory/AGENT_CONTRACT_V118.md
      RI_MODEL_COMMAND: python researcher_inventory/v118_openai_agents_adapter.py
      RI_AGENT_SESSION_TIMEOUT_SECONDS: 600
      RI_AGENT_SESSION_TOTAL_TIMEOUT_SECONDS: 1800
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          git config user.name "APA Cases Apparatus"
          git config user.email "apa-cases-apparatus@users.noreply.github.com"

      - name: Run V118 gated calibration and certification pipeline
        shell: bash
        run: |
          set -euo pipefail
          bash researcher_inventory/v118_pipeline.sh
