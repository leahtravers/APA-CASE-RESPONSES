name: Researcher Inventory Apparatus Verification
# Calibration evidence is durably preserved outside researcher_inventory so failed attempts remain inspectable without retrigger loops.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'researcher_inventory/**'
      - '.github/workflows/researcher-inventory-contract-test.yml'

permissions:
  contents: write

concurrency:
  group: researcher-inventory-apparatus-verification
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPENAI_API_KEY: ${{ secrets.CASES_INVENTORY_KEY }}
      OPENAI_MODEL: gpt-5.6-sol
      CONTRACT_VERSION: RI-CONTRACT-V11
      RI_MODEL_COMMAND: python researcher_inventory/openai_agents_adapter.py
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          git config user.name "APA Cases Apparatus"
          git config user.email "apa-cases-apparatus@users.noreply.github.com"

      - name: Verify immutable Leah-approved archetype workbooks
        shell: bash
        run: |
          set -euo pipefail
          python -m researcher_inventory.verify_archetypes
          git add \
            researcher_inventory/tests/archetypes/Case_2_Lightweight_Researcher_Inventory.xlsx \
            researcher_inventory/tests/archetypes/Case_6_Lightweight_Researcher_Inventory_v2_with_Verbs_and_Locators.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "tests: restore immutable researcher inventory archetypes [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Verify secret and deterministic apparatus
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          python -m unittest researcher_inventory.tests.test_inventory_apparatus -v

      - name: Stop if already clean-room certified
        id: final_state
        shell: bash
        run: |
          if [ -f researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md ]; then
            echo "certified=true" >> "$GITHUB_OUTPUT"
          else
            echo "certified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Calibrate hidden archetypes on one bounded agent lineage
        id: calibration
        if: steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p researcher_inventory/runtime researcher_inventory/status
          : > researcher_inventory/runtime/training_history.ndjson
          python researcher_inventory/session_bootstrap.py

          echo '=== DIAGNOSTIC ARCHETYPE BATCH ==='
          TEST_REPETITIONS=1 python -m researcher_inventory.apparatus_calibration_runner

          echo '=== REPEATABILITY BATCH 1 ==='
          TEST_REPETITIONS=2 python -m researcher_inventory.apparatus_calibration_runner

          echo '=== REPEATABILITY BATCH 2 ==='
          TEST_REPETITIONS=2 python -m researcher_inventory.apparatus_calibration_runner

          cat > researcher_inventory/status/ARCHETYPE_CALIBRATED.md <<'EOF'
          # Researcher Inventory Apparatus Archetype Calibration

          V11 independent-coordinate apparatus passed the hidden Case 2/Case 6 diagnostic batch and two further repeated verification batches on the same finalized contract and saved-agent lineage. The worker had no archetype access. The immutable Case 2 and Case 6 workbook SHA-256 gate passed before calibration.
          EOF

      - name: Run sealed Case 5 exactly once on calibrated lineage
        id: holdout
        if: steps.calibration.outcome == 'success'
        shell: bash
        run: python -m researcher_inventory.holdout_runner

      - name: Fresh-agent clean-room proof
        id: clean_room
        if: steps.holdout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python researcher_inventory/session_bootstrap.py
          TEST_REPETITIONS=2 python -m researcher_inventory.apparatus_calibration_runner
          python -m researcher_inventory.holdout_runner
          cat > researcher_inventory/status/CLEAN_ROOM_CERTIFIED.md <<'EOF'
          # Researcher Inventory Apparatus Clean-Room Certification

          V11 passed immutable workbook hash verification, deterministic code tests, repeated hidden Case 2/Case 6 calibration, one sealed Case 5 holdout on the calibration lineage, then Case 2/Case 6 and Case 5 again with a newly bootstrapped extractor that had no prior session history. No archetypes or holdout outputs were exposed to either worker.
          EOF

      - name: Commit durable status
        if: steps.clean_room.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add researcher_inventory/status
          if ! git diff --cached --quiet; then
            git commit -m "apparatus: certify researcher inventory v11 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Preserve calibration evidence durably
        if: always() && steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HISTORY_DIR="calibration_history/researcher_inventory/${GITHUB_RUN_ID}"
          mkdir -p "$HISTORY_DIR"

          if [ -f researcher_inventory/runtime/archetype_integrity.json ]; then
            cp researcher_inventory/runtime/archetype_integrity.json "$HISTORY_DIR/archetype_integrity.json"
          fi
          if [ -f researcher_inventory/runtime/training_history.ndjson ]; then
            cp researcher_inventory/runtime/training_history.ndjson "$HISTORY_DIR/training_history.ndjson"
          fi
          if [ -f researcher_inventory/runtime/test_results.json ]; then
            cp researcher_inventory/runtime/test_results.json "$HISTORY_DIR/test_results.json"
          fi

          python - <<'PY' > "$HISTORY_DIR/run_manifest.json"
          import json, os
          print(json.dumps({
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "contract_version": os.environ.get("CONTRACT_VERSION"),
              "model": os.environ.get("OPENAI_MODEL"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "evidence_policy": "calibration-only; sealed holdout source/output deliberately excluded",
          }, sort_keys=True, indent=2))
          PY

          git add "$HISTORY_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "training-history: preserve researcher inventory run ${GITHUB_RUN_ID} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Preserve results in workflow log
        if: always() && steps.final_state.outputs.certified != 'true'
        shell: bash
        run: |
          echo '=== ARCHETYPE INTEGRITY ==='
          test -f researcher_inventory/runtime/archetype_integrity.json && cat researcher_inventory/runtime/archetype_integrity.json || true
          echo '=== COMPLETE CALIBRATION HISTORY ==='
          test -f researcher_inventory/runtime/training_history.ndjson && cat researcher_inventory/runtime/training_history.ndjson || true
          echo '=== LAST CALIBRATION BATCH ==='
          test -f researcher_inventory/runtime/test_results.json && cat researcher_inventory/runtime/test_results.json || true
          echo '=== HOLDOUT EVIDENCE OMITTED FROM DURABLE PUBLIC HISTORY ==='
          test -f researcher_inventory/runtime/holdout_result.json && echo 'holdout_result.json exists in runtime but is not committed' || true
